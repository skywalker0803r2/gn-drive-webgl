<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GN Drive particle simulation and interactive web experience"
    />
    <title>GN Drive Particle Experience</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="hud">
        <div class="brand">
          <span class="dot"></span>
          GN Drive
        </div>
        <div class="actions">
          <button id="modeToggle" type="button">切換至 Trans-AM</button>
        </div>
      </div>

      <aside class="panel" aria-label="GN Drive control panel">
        <div class="panel-header">
          <span class="eyebrow">GN Drive / Simulation</span>
          <h1>粒子噴射控制</h1>
        </div>

        <div class="stats">
          <div>
            <span class="label">模式</span>
            <strong id="modeLabel">Normal</strong>
          </div>
          <div>
            <span class="label">焦點</span>
            <strong>Core</strong>
          </div>
          <div>
            <span class="label">強度</span>
            <strong id="powerValue">1.0x</strong>
          </div>
        </div>

        <div class="tab-group">
          <button type="button" class="tab active" data-tab="overview">Overview</button>
          <button type="button" class="tab" data-tab="math">Math</button>
          <button type="button" class="tab" data-tab="system">System</button>
        </div>

        <div class="tab-panel active" data-panel="overview">
          <p>
            GN 爐透過軸向推進、螺旋渦流與亂流雜訊組成高能量噴射場，形成綠色發光核心與穩定外圍光環。
          </p>
        </div>

        <div class="tab-panel" data-panel="math">
          <p>
            P(t) = P₀ + V_axial(t) + R_vortex(t) + D_noise(P, t)
          </p>
        </div>

        <div class="tab-panel" data-panel="system">
          <ul>
            <li>Three.js 3D 場景</li>
            <li>GLSL 粒子運算</li>
            <li>GSAP 狀態轉場</li>
          </ul>
        </div>
      </aside>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
